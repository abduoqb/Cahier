<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
</defs>
<rect width="960" height="680" fill="#fff"/>
<text x="210" y="32" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">SERVEUR (passif)</text>
<text x="750" y="32" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">CLIENT (actif)</text>
<line x1="210" y1="45" x2="210" y2="660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="750" y1="45" x2="750" y2="660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
<line x1="210" y1="105" x2="210" y2="123"/><line x1="210" y1="175" x2="210" y2="193"/><line x1="210" y1="245" x2="210" y2="263"/>
<line x1="210" y1="325" x2="210" y2="398"/><line x1="210" y1="460" x2="210" y2="488"/><line x1="210" y1="540" x2="210" y2="568"/>
<line x1="750" y1="105" x2="750" y2="263"/><line x1="750" y1="325" x2="750" y2="353"/><line x1="750" y1="405" x2="750" y2="488"/><line x1="750" y1="540" x2="750" y2="568"/>
</g>
<g stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#b)">
<line x1="630" y1="295" x2="332" y2="295"/>
<line x1="630" y1="380" x2="332" y2="425"/>
<line x1="332" y1="515" x2="630" y2="515"/>
</g>
<g font-size="16" fill="#1e293b" text-anchor="middle">
<rect x="90" y="55" width="240" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="210" y="86">socket()</text>
<rect x="90" y="125" width="240" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="210" y="156">bind()  (adresse + port)</text>
<rect x="90" y="195" width="240" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="210" y="226">listen()  (file d'attente)</text>
<rect x="90" y="265" width="240" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="210" y="290">accept()  BLOQUANT</text><text x="210" y="312" font-size="14">rend la socket de service</text>
<rect x="90" y="400" width="240" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="210" y="425">read()</text><text x="210" y="447" font-size="14">traite la requête</text>
<rect x="90" y="490" width="240" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="210" y="521">write()  (réponse)</text>
<rect x="90" y="570" width="240" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="210" y="601">close()  (socket de service)</text>
<rect x="630" y="55" width="240" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="750" y="86">socket()</text>
<rect x="630" y="265" width="240" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="750" y="290">connect()</text><text x="750" y="312" font-size="14">IP + port du serveur</text>
<rect x="630" y="355" width="240" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="750" y="386">write()  (requête)</text>
<rect x="630" y="490" width="240" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="750" y="521">read()  (réponse)</text>
<rect x="630" y="570" width="240" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="750" y="601">close()</text>
</g>
<g font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">
<text x="480" y="283">demande de connexion</text>
<text x="480" y="372">requête</text>
<text x="480" y="506">réponse</text>
</g>
<text x="480" y="655" font-size="14" fill="#475569" text-anchor="middle">Serveur lancé AVANT le client. Serveur parallèle : fork() juste après accept().</text>
</svg>
