<text x="746.0" y="307" font-size="16" fill="#1e293b" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" >INSERT INTO</text>
<rect x="641.0" y="326" width="210" height="34" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1.2" />
<text x="746.0" y="349" font-size="16" fill="#1e293b" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" >UPDATE</text>
<rect x="641.0" y="368" width="210" height="34" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1.2" />
<text x="746.0" y="391" font-size="16" fill="#1e293b" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" >DELETE</text>
<rect x="903.0" y="76" width="270" height="350" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5" />
<path d="M903.0 146 V88 Q903.0 76 915.0 76 H1161.0 Q1173.0 76 1173.0 88 V146 Z" fill="#7c3aed"/>
<text x="1038.0" y="124" font-size="34" fill="#fff" font-weight="bold" text-anchor="middle" >LCD</text>
<text x="1038.0" y="178" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle" >Langage de Contrôle des Données</text>
<text x="1038.0" y="218" font-size="20" fill="#5b21b6" font-weight="bold" text-anchor="middle" >GÈRE les droits</text>
<text x="1038.0" y="242" font-size="14.5" fill="#475569" font-weight="normal" text-anchor="middle" >(qui peut faire quoi)</text>
<line x1="927.0" y1="266" x2="1149.0" y2="266" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="933.0" y="284" width="210" height="34" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.2" />
<text x="1038.0" y="307" font-size="16" fill="#1e293b" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" >GRANT</text>
<rect x="933.0" y="326" width="210" height="34" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.2" />
<text x="1038.0" y="349" font-size="16" fill="#1e293b" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" >REVOKE</text>
<text x="600.0" y="458" font-size="14.5" fill="#475569" font-weight="normal" text-anchor="middle" font-style="italic" >Certains cours rangent SELECT dans le LMD ; ici (cours de Caen) le LID est distingué.</text>

