<rect width="1200" height="480" fill="#fff"/>
<text x="600.0" y="40" font-size="24" fill="#1e293b" font-weight="bold" text-anchor="middle" >Les 4 sous-langages d'un SGBD relationnel (SQL)</text>
<rect x="27.0" y="76" width="270" height="350" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
<path d="M27.0 146 V88 Q27.0 76 39.0 76 H285.0 Q297.0 76 297.0 88 V146 Z" fill="#2563eb"/>
<text x="162.0" y="124" font-size="34" fill="#fff" font-weight="bold" text-anchor="middle" >LDD</text>
<text x="162.0" y="178" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle" >Langage de Définition des Données</text>
<text x="162.0" y="218" font-size="20" fill="#1e40af" font-weight="bold" text-anchor="middle" >définit la STRUCTURE</text>
<text x="162.0" y="242" font-size="14.5" fill="#475569" font-weight="normal" text-anchor="middle" >(schéma : tables, colonnes, vues)</text>
<line x1="51.0" y1="266" x2="273.0" y2="266" stroke="#2563eb" stroke-width="1.5"/>
